# =====================================================================
# 05_artifacts_and_secrets.yml - using SECRETS safely and publishing
#                                ARTIFACTS (reports, logs, screenshots)
# ---------------------------------------------------------------------
# SAMPLE ONLY.
# Create secrets in GitHub:  Repo -> Settings -> Secrets and variables
#                            -> Actions -> New repository secret
#   e.g.  QA_API_TOKEN = abc123...
# Secrets are masked (***) in logs and are NOT given to workflows
# triggered from forks.
# =====================================================================

name: 05 Artifacts and Secrets

on:
  workflow_dispatch:

permissions:
  contents: read                   # least privilege for the GITHUB_TOKEN

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation_framework
    env:
      # Secret -> environment variable. Your code reads os.environ["QA_API_TOKEN"].
      QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
      # Non-secret configuration can use repository VARIABLES
      TEST_ENV: ${{ vars.TEST_ENV || 'qa' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt      # lives at the repo root

      - run: pip install -r ../requirements.txt

      - name: Check the secret exists (without printing it!)
        shell: bash
        run: |
          if [ -z "$QA_API_TOKEN" ]; then
            echo "QA_API_TOKEN is not set - token-based tests will be skipped"
          else
            echo "QA_API_TOKEN is set (length ${#QA_API_TOKEN})"
          fi

      - name: Run CLI tests
        id: tests
        run: pytest -m cli --env "$TEST_ENV" --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml

      - name: Upload report, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            automation_framework/reports/
            automation_framework/logs/
            automation_framework/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots ONLY when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ github.run_number }}
          path: automation_framework/screenshots/
          if-no-files-found: ignore
