# =====================================================================
# 04_scheduled_headless.yml - nightly regression + manual trigger,
#                             Linux GUI app under Xvfb (virtual display)
# ---------------------------------------------------------------------
# SAMPLE ONLY.
#
# "Headless" = no human watching and (on Linux) no physical monitor.
#  * CLI tests are naturally headless.
#  * Linux GUI apps can run on a VIRTUAL display: Xvfb (X virtual frame buffer).
#  * Windows desktop apps (Calculator, Notepad) do NOT run on Linux at all.
#    windows-latest is Windows SERVER without Store Calculator / Win11 Notepad
#    and without an interactive desktop -> use a SELF-HOSTED Windows 10/11
#    runner started with run.cmd in a logged-in, unlocked session.
# =====================================================================

name: 04 Nightly Regression (scheduled)

on:
  schedule:
    # cron: minute hour day-of-month month day-of-week   (always UTC!)
    - cron: "30 20 * * 1-5"        # 20:30 UTC Mon-Fri = 02:00 IST Tue-Sat (course repo uses "30 20 * * *" = daily)
  workflow_dispatch:               # manual run with an input
    inputs:
      env:
        description: "Environment to test"
        required: true
        default: qa
        type: choice
        options: [ dev, qa ]

env:
  # value from the manual input, or 'qa' for scheduled runs (inputs is empty then)
  TEST_ENV: ${{ inputs.env || 'qa' }}

jobs:
  cli-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation_framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt      # lives at the repo root
      - run: pip install -r ../requirements.txt
      - name: Run CLI regression against ${{ env.TEST_ENV }}
        run: pytest -m "cli and regression" --env "$TEST_ENV" --html=reports/nightly_cli.html --self-contained-html

  linux-gui-under-xvfb:
    # Example for a LINUX GUI application (e.g. a Tk / Qt tool you own).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run GUI tests on a virtual screen
        # xvfb-run starts a fake X server, sets DISPLAY, runs the command, stops the server
        run: xvfb-run -a python -c "import os; print('DISPLAY =', os.environ.get('DISPLAY'))"

  windows-desktop-self-hosted:
    # Runs on YOUR registered Windows machine (labels are set when you register it).
    # The runner must run as a normal logged-in user (not as a service in session 0)
    # and the screen must not be locked - otherwise UIA cannot see any windows.
    if: vars.DESKTOP_RUNNER_AVAILABLE == 'true'   # repository variable switches it on
    runs-on: [ self-hosted, windows ]
    defaults:
      run:
        working-directory: automation_framework
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r ../requirements.txt
      - run: python -m pytest -m desktop --env "$env:TEST_ENV" --html=reports/nightly_desktop.html --self-contained-html
