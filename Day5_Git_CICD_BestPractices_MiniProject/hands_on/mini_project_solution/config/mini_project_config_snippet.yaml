# =====================================================================
# Mini project configuration snippet
# ---------------------------------------------------------------------
# MERGE the `mini_project:` block into EACH environment of
# automation_framework/config/config.yaml (indent it at the same level
# as `timeouts:`, `calculator:` ...). Example of the result:
#
#   environments:
#     dev:
#       log_level: DEBUG
#       timeouts: ...
#       mini_project:          <-- new block
#         expressions_file: expressions.csv
#         ...
#
# Missing keys fall back to defaults in workflows/mini_project_settings.py,
# so the suite still runs if you forget one environment.
# Select the environment at run time:   pytest --env qa   (or TEST_ENV=qa)
# =====================================================================

environments:
  dev:
    mini_project:
      expressions_file: expressions.csv       # 4 quick rows for developers
      report_prefix: calc_report_dev
      archive:
        pattern: "*.log"
        keep_last: 3

  qa:
    mini_project:
      expressions_file: expressions_qa.csv    # full regression data set
      report_prefix: calc_report_qa
      archive:
        pattern: "*.log"
        keep_last: 5
