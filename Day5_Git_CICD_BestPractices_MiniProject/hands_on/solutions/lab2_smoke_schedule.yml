# =====================================================================
# Lab 2 solution - Task 5: an extra SCHEDULED smoke workflow
# Destination in your repo:  .github/workflows/smoke-schedule.yml
#
# Runs only the fast smoke CLI tests every weekday morning (before the
# team starts) and on demand. The full regression stays in automation-ci.yml.
# =====================================================================
name: Morning Smoke

on:
  schedule:
    - cron: "0 3 * * 1-5"        # 03:00 UTC Mon-Fri = 08:30 IST
    # For the lab you may TEMPORARILY use "*/15 * * * *" (every 15 min) to see it fire,
    # then change it back - GitHub may delay scheduled runs by several minutes.
  workflow_dispatch:
    inputs:
      env:
        description: "Environment from config.yaml"
        default: dev
        type: choice
        options: [ dev, qa ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automation_framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ../requirements.txt
      - name: Smoke tests (CLI only)
        run: pytest -m "cli and smoke" --env ${{ inputs.env || 'dev' }} --html=reports/smoke.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: |
            automation_framework/reports/
            automation_framework/logs/
          retention-days: 5
