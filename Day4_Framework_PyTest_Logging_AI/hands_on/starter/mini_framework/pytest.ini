[pytest]
testpaths = tests
pythonpath = .
# TODO (Lab 2, step 1): add  -m "not demo_fail"  so the deliberate failure is deselected by default
addopts = -v -ra --strict-markers
markers =
    smoke: quick, critical checks - run on every build
    regression: full coverage
    cli: runs a command-line program
#   TODO (Lab 2, step 1): register two more markers:
#       desktop   - drives a (here: simulated) desktop window
#       demo_fail - deliberately failing test to show screenshot-on-failure
log_file = logs/pytest_last_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
