[pytest]
testpaths = tests
pythonpath = .
addopts = -v -ra --strict-markers -m "not demo_fail"
markers =
    smoke: quick, critical checks - run on every build
    regression: full coverage
    desktop: drives a (here: simulated) desktop window
    cli: runs a command-line program
    demo_fail: deliberately failing test to show screenshot-on-failure (opt-in: -m demo_fail)
log_file = logs/pytest_last_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
