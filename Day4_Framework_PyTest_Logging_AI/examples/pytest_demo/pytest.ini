[pytest]
# ---------------------------------------------------------------------------
# pytest configuration for the Day 4 demo project
# ---------------------------------------------------------------------------
# Where to look for tests and which files/classes/functions count as tests
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options added to EVERY run:
#   -v                      verbose (one line per test)
#   -ra                     short summary of skipped / xfailed / failed tests
#   --strict-markers        typo in a marker name = error (not silently ignored)
#   -m "not demo_fail"      the deliberately failing demo test is deselected by default.
#                           Opt in with:  pytest -m demo_fail   (a later -m overrides this one)
addopts = -v -ra --strict-markers -m "not demo_fail"

# Custom markers MUST be registered (because of --strict-markers)
markers =
    smoke: quick, critical checks run on every build
    regression: full functional checks
    slow: long-running tests (deselect with -m "not slow")
    desktop: tests that would drive a desktop window in the real framework
    cli: tests that run a command-line tool
    demo_fail: deliberately failing test to demo screenshot + log capture (opt-in)

# Live console logging (off by default - switch on with: pytest --log-cli-level=INFO)
log_cli = false
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s

# Every run also writes a full DEBUG log file (overwritten each run)
log_file = logs/pytest_demo.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
